# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New + > Blueprint > pick this repo. Fill the "sync: false" values when prompted.
services:
  - type: web
    name: tollgate
    runtime: node
    plan: free # use "starter" during judging (Dec 1-15) so the demo never sleeps
    region: oregon
    buildCommand: npm ci && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /.well-known/tollgate.json
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # PayPal sandbox app
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Postgres (Neon): pooled URL for the app, direct URL for migrations
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # AI
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      # Tollgate
      - key: TOLLGATE_TOKEN_SECRET
        generateValue: true
      - key: DEMO_AGENT_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PAYOUT_EMAIL
        sync: false
